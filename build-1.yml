name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Buat file proyek
        run: |
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TikTokCounter"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.tiktokcounter"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tiktokcounter"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CounterService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_5'
          <resources>
              <string name="app_name">Hitung Scroll Video</string>
              <string name="service_desc">Menghitung berapa kali Anda berpindah video di TikTok, YouTube Shorts, dan Instagram Reels dan menampilkan angkanya di layar. Tidak membaca isi video, akun, atau pesan.</string>
          </resources>
          EOF_5
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewScrolled|typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          EOF_6
          mkdir -p app/src/main/java/com/example/tiktokcounter
          cat > app/src/main/java/com/example/tiktokcounter/CounterService.kt <<'EOF_7'
          package com.example.tiktokcounter

          import android.accessibilityservice.AccessibilityService
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.TextView

          class CounterService : AccessibilityService() {

              // TikTok global dan TikTok versi Asia (termasuk Indonesia): semua scroll dihitung
              private val always = setOf("com.zhiliaoapp.musically", "com.ss.android.ugc.trill")
              // YouTube (Shorts) dan Instagram (Reels): hanya dihitung kalau layar Shorts/Reels terdeteksi
              private val shortForm = setOf("com.google.android.youtube", "com.instagram.android")
              private val tiktok = always + shortForm
              private var lastPkg = ""
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager
              private lateinit var prefs: SharedPreferences
              private var overlay: TextView? = null

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                  if (key == "count") render()
              }

              // Satu geseran memicu banyak event; hitung 1 kali setelah event berhenti 500 ms.
              private val commit = Runnable {
                  if (lastPkg in always || (lastPkg in shortForm && inShortFeed())) {
                      prefs.edit().putInt("count", prefs.getInt("count", 0) + 1).apply()
                  }
              }

              private fun inShortFeed(): Boolean {
                  val root = rootInActiveWindow ?: return false
                  return scan(root, 0)
              }

              private fun scan(n: android.view.accessibility.AccessibilityNodeInfo, depth: Int): Boolean {
                  if (depth > 25) return false
                  val id = n.viewIdResourceName?.lowercase()
                  if (id != null && (id.contains("reel") || id.contains("shorts"))) return true
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      if (scan(c, depth + 1)) return true
                  }
                  return false
              }

              override fun onServiceConnected() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  prefs = getSharedPreferences("counter", MODE_PRIVATE)
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent) {
                  val pkg = e.packageName?.toString() ?: return
                  when (e.eventType) {
                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED -> {
                          if (pkg in tiktok) show()
                          else if (pkg != "com.android.systemui" && pkg != packageName) hide()
                      }
                      AccessibilityEvent.TYPE_VIEW_SCROLLED -> {
                          if (pkg in tiktok) {
                              lastPkg = pkg
                              show()
                              handler.removeCallbacks(commit)
                              handler.postDelayed(commit, 500)
                          }
                      }
                  }
              }

              private fun show() {
                  if (overlay != null) return
                  val tv = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      setBackgroundColor(0xB3000000.toInt())
                      textSize = 18f
                      setPadding(28, 18, 28, 18)
                  }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 24
                      y = 220
                  }
                  wm.addView(tv, lp)
                  overlay = tv
                  render()
              }

              private fun hide() {
                  overlay?.let { wm.removeView(it) }
                  overlay = null
              }

              private fun render() {
                  val c = prefs.getInt("count", 0)
                  overlay?.text = "Video ke-${c + 1}\nSudah di-scroll: $c"
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  handler.removeCallbacks(commit)
                  hide()
                  if (::prefs.isInitialized) prefs.unregisterOnSharedPreferenceChangeListener(prefListener)
                  super.onDestroy()
              }
          }
          EOF_7
          mkdir -p app/src/main/java/com/example/tiktokcounter
          cat > app/src/main/java/com/example/tiktokcounter/MainActivity.kt <<'EOF_8'
          package com.example.tiktokcounter

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var countView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                  }
                  box.addView(TextView(this).apply {
                      text = "1. Ketuk tombol di bawah, cari \"Hitung Scroll Video\", lalu aktifkan.\n" +
                          "2. Buka TikTok, YouTube Shorts, atau Instagram Reels dan mulai scroll. Angka muncul di atas layar."
                      textSize = 16f
                  })
                  box.addView(Button(this).apply {
                      text = "Buka pengaturan Aksesibilitas"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  countView = TextView(this).apply { textSize = 22f; setPadding(0, 48, 0, 24) }
                  box.addView(countView)
                  box.addView(Button(this).apply {
                      text = "Reset hitungan"
                      setOnClickListener {
                          getSharedPreferences("counter", MODE_PRIVATE).edit().putInt("count", 0).apply()
                          refresh()
                      }
                  })
                  setContentView(box)
              }

              override fun onResume() { super.onResume(); refresh() }

              private fun refresh() {
                  val c = getSharedPreferences("counter", MODE_PRIVATE).getInt("count", 0)
                  countView.text = "Sudah di-scroll: $c"
              }
          }
          EOF_8
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HitungScrollVideo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
